version: '3.9'
services:
  postgres-users:
    image: postgres:14-alpine
    ports:
      - 5433:5432
    environment:
      - POSTGRES_PASSWORD=S3cret
      - POSTGRES_USER=postgresusers
      - POSTGRES_DB=postgresusers_db
  postgres-actors:
    image: postgres:14-alpine
    ports:
      - 5431:5432
    environment:
      - POSTGRES_PASSWORD=S3cret
      - POSTGRES_USER=postgresactors
      - POSTGRES_DB=postgresactors_db
