<!DOCTYPE html>
<html lang="en-US">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>AcVis</title>
    <link rel="icon" type="image/png" href="./img/iconmonstr-customer-1-64.png" sizes="64x64">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet">

    <link rel="stylesheet" type="text/css" href="./css/index.css">
    <link rel="stylesheet" type="text/css" href="./css/navbar.css">
    <link rel="stylesheet" type="text/css" href="./css/edit_profile.css">
    <link rel="stylesheet" type="text/css" href="./css/footer.css">
</head>
<body>

<div class="container">
    <app-navbar></app-navbar>

    <section class="edit-profile">
        <img src="./img/blank-profile-picture-973460_640.png" alt="User Image" class="edit-profile--img">
        <h2 class="edit-profile--title">Edit profile</h2>
        <form action="/edit_profile" method="post" class="edit-profile__form">
            <label for="email" class="edit-profile--label">Email:</label>
            <input type="text" value="your_email@gmail.com" id="email" name="email" class="edit-profile--input" required>

            <label for="username" class="edit-profile--label">Username:</label>
            <input type="text" value="your_username" id="username" name="username" class="edit-profile--input" required>

            <label for="gender" class="edit-profile--label">Gender:</label>
            <select name="gender" id="gender" class="edit-profile--input">
                <option value=""></option>
                <option value="male">Male</option>
                <option value="female">Female</option>
                <option value="others">Others</option>
            </select>

            <label for="password" class="edit-profile--label">Password:</label>
            <input type="password" id="password" name="password" class="edit-profile--input" required>

            <button type="submit" class="edit-profile--button">Edit Profile</button>

        </form>
    </section>


    <app-footer></app-footer>
</div>

<script type="module" src="./js/index.js"></script>
<script src="./js/drawer.js"></script>
</body>
</html>
