<!DOCTYPE html>
<html lang="en-US">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>AcVis</title>
    <link rel="icon" type="image/png" href="./img/iconmonstr-customer-1-64.png" sizes="64x64">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet">

    <link rel="stylesheet" type="text/css" href="./css/index.css">
    <link rel="stylesheet" type="text/css" href="./css/navbar.css">
    <link rel="stylesheet" type="text/css" href="./css/statistics.css">
    <link rel="stylesheet" type="text/css" href="./css/footer.css">
</head>
<body>

<div class="container">
    <nav class="navbar">
        <div class="navbar--logo">
            <a href="#">AcVis</a>
        </div>
        <div class="navbar__links" id="navbarLinks">
            <a href="#">Dummy 1</a>
            <a href="#">Dummy 2</a>
            <a href="#">Dummy 3</a>
            <a href="#">Login</a>
        </div>
        <button class="navbar--toggle" id="navbarToggle">☰</button>
    </nav>

    <div class="statistics">
        <h1 class="statistics--title">Graphs about actors</h1>

        <ul>
            <li class="statistic">
                <h2 class="statistic--title">How many rewards won the actors from United Stated in the last decade:
                    1234</h2>
            </li>
            <li class="statistic">
                <h2 class="statistic--title">How many rewards won the actors from United Stated through the time (graph
                    per years)</h2>
                <img src="./img/rc-xyz-nft-gallery-w9coDxtsfts-unsplash.jpg" alt="Statistic 1" class="statistic--img">
            </li>
            <li class="statistic">
                <h2 class="statistic--title">Statistic 2</h2>
                <img src="./img/rc-xyz-nft-gallery-w9coDxtsfts-unsplash.jpg" alt="Statistic 1" class="statistic--img">
            </li>
            <li class="statistic">
                <h2 class="statistic--title">Statistic 3</h2>
                <img src="./img/rc-xyz-nft-gallery-w9coDxtsfts-unsplash.jpg" alt="Statistic 1" class="statistic--img">
            </li>
            <li class="statistic">
                <h2 class="statistic--title">Statistic 4</h2>
                <img src="./img/rc-xyz-nft-gallery-w9coDxtsfts-unsplash.jpg" alt="Statistic 1" class="statistic--img">
            </li>
        </ul>
    </div>

    <app-footer></app-footer>
</div>

<script type="module" src="./js/index.js"></script>
<script>
    document.addEventListener('DOMContentLoaded', (event) => {
        const navbarToggle = document.getElementById('navbarToggle');
        const navbarLinks = document.getElementById('navbarLinks');

        navbarToggle.addEventListener('click', () => {
            navbarLinks.classList.toggle('active');
        });
    });

</script>
</body>
</html>
