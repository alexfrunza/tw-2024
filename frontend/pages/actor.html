<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AcVis</title>
    <link rel="icon" type="image/png" href="../img/iconmonstr-customer-1-64.png" sizes="64x64">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet">

    <link rel="stylesheet" type="text/css" href="../css/index.css">
    <link rel="stylesheet" type="text/css" href="../css/navbar.css">
    <link rel="stylesheet" type="text/css" href="../css/footer.css">
    <link rel="stylesheet" type="text/css" href="../css/actor.css">
</head>
<body>

<div class="container">
    <app-navbar></app-navbar>

    <div class="actor-profile">
        <img src="../img/unknown.jpg" alt="unknown" class="actor-profile--image">
        <div class="actor-profile--name">
            <h1>Unknown</h1>
        </div>
    </div>
    <div class="description" id="description">

    </div>
    <div class="news-container" id="news-container">
        <p>Recent news:</p>

    </div>
    <app-footer></app-footer>
</div>

<script type="module" src="../js/index.js"></script>
<script src="../js/drawer.js"></script>

<script>
    document.addEventListener('DOMContentLoaded', async function () {

        const params = new URLSearchParams(window.location.search);
        const id = params.get('id');

        if (id) {
            try {
                const response = await fetch(`http://127.0.0.1:5001/actors/${id}`);
                if (!response.ok) {
                    throw new Error('Network response was not ok');
                }
                const data = await response.json();

                const actorNameElement = document.querySelector('.actor-profile--name h1');
                actorNameElement.textContent = data.data.name;

                const actorImageElement = document.querySelector('.actor-profile--image');
                let path = data.data.profile_path;
                if (!path) {
                    actorImageElement.src = '../img/unknown.jpg';
                } else {
                    actorImageElement.src = 'https://image.tmdb.org/t/p/w500' + path;
                }


                const descriptionElement = document.getElementById('description');
                descriptionElement.innerHTML = `<h2>Known For:</h2><ul id="movie-list"></ul>`;
                const movieList = document.getElementById('movie-list');
                data.data.known_for.forEach(movie => {
                    const listItem = document.createElement('li');
                    listItem.innerHTML = `<strong>${movie.title}</strong> (${movie.release_date.split('-')[0]}): ${movie.overview}`;
                    movieList.appendChild(listItem);
                });

                const newsContainer = document.getElementById('news-container');
                data.data.news.slice(0, 3).forEach(article => {
                    const newsItem = document.createElement('div');
                    newsItem.classList.add('news-container__news');
                    newsItem.innerHTML = `
                        <img src="${article.urlToImage || '../img/unknown.jpg'}" alt="${article.title}" class="news-container--image">
                        <p class="news-container--title"><a href="${article.url}" target="_blank">${article.title}</a></p>
                        <p class="news-container--source">Source: ${article.source.name}</p>
                        <p class="news-container--description">${article.description}</p>
                    `;
                    newsContainer.appendChild(newsItem);
                });

            } catch (error) {
                console.error('Error fetching actor data:', error);
            }
        } else {
            console.error('ID parameter not found in URL');
        }
    });
</script>

</body>
</html>
