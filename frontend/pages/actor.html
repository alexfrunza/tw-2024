<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AcVis</title>
    <link rel="icon" type="image/png" href="../img/iconmonstr-customer-1-64.png" sizes="64x64">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet">

    <link rel="stylesheet" type="text/css" href="../css/index.css">
    <link rel="stylesheet" type="text/css" href="../css/navbar.css">
    <link rel="stylesheet" type="text/css" href="../css/footer.css">
    <link rel="stylesheet" type="text/css" href="../css/actor.css">
</head>
<body>

<div class="container">
    <app-navbar></app-navbar>

    <div class="actor-profile">
        <img src="../img/unknown.jpg" alt="unknown" class="actor-profile--image">
        <div class="actor-profile--name">
            <h1>Unknown</h1>
        </div>
    </div>
    <div class="description" id="description">
        <!-- Aici va fi actualizată descrierea actorului -->
    </div>
    <div class="news-container">
        <p>Recent news:</p>
        <div class="news-container__news">
            <img src="../img/jdepp.jpg" alt="johnny depp photo" class="news-container--image">
            <p class="news-container--title">News Title</p>
        </div>
        <div class="news-container__news">
            <img src="../img/jdepp.jpg" alt="johnny depp photo" class="news-container--image">
            <p class="news-container--title">News Title</p>
        </div>
    </div>
    <app-footer></app-footer>
</div>

<script type="module" src="../js/index.js"></script>
<script src="../js/drawer.js"></script>

<script>
    document.addEventListener('DOMContentLoaded', async function() {

        const params = new URLSearchParams(window.location.search);
        const id = params.get('id');

        if (id) {
            try {
                // Facem o cerere GET către server pentru a obține detaliile actorului
                const response = await fetch(`http://127.0.0.1:5001/actors/${id}`);
                if (!response.ok) {
                    throw new Error('Network response was not ok');
                }
                const data = await response.json();

                // Actualizăm numele actorului în pagină
                const actorNameElement = document.querySelector('.actor-profile--name h1');
                actorNameElement.textContent = data.data.name;

                // Actualizăm imaginea actorului în pagină sau folosim o imagine default dacă nu există imageUrl
                const actorImageElement = document.querySelector('.actor-profile--image');
                actorImageElement.src = data.data.imageUrl !== '' ? data.data.imageUrl : '../img/unknown.jpg';

                // Generăm lista de filme în care actorul este cunoscut
                const descriptionElement = document.getElementById('description');
                descriptionElement.innerHTML = `<h2>Known For:</h2><ul id="movie-list"></ul>`;
                const movieList = document.getElementById('movie-list');
                data.data.known_for.forEach(movie => {
                    const listItem = document.createElement('li');
                    listItem.innerHTML = `<strong>${movie.title}</strong> (${movie.release_date.split('-')[0]}): ${movie.overview}`;
                    movieList.appendChild(listItem);
                });

            } catch (error) {
                console.error('Error fetching actor data:', error);
            }
        } else {
            console.error('ID parameter not found in URL');
        }
    });
</script>

</body>
</html>
