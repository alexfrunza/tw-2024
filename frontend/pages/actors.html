<!DOCTYPE html>
<html lang="en-US">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>AcVis</title>
    <link rel="icon" type="image/png" href="../img/iconmonstr-customer-1-64.png" sizes="64x64">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet">

    <link rel="stylesheet" type="text/css" href="../css/index.css">
    <link rel="stylesheet" type="text/css" href="../css/navbar.css">
    <link rel="stylesheet" type="text/css" href="../css/actors.css">
    <link rel="stylesheet" type="text/css" href="../css/footer.css">
</head>
<body>

<div class="container">
    <app-navbar></app-navbar>

    <h2 class="page-title"> Actors </h2>
    <div class="actors-section">
        <div class="actors-section__navigation">
            <label for="search"></label>
            <input type="text" id="search" name="search" class="actors-section--input">
            <button type="submit" class="actors-section--button">Search</button>
        </div>
        <div id="actors-container" class="actors-section__gallery">

        </div>
        <div id="pagination">

        </div>
    </div>


    <app-footer></app-footer>
</div>

<script type="module" src="../js/index.js"></script>
<script>
    document.addEventListener('DOMContentLoaded', (event) => {
        const navbarToggle = document.getElementById('navbarToggle');
        const navbarLinks = document.getElementById('navbarLinks');

        navbarToggle.addEventListener('click', () => {
            navbarLinks.classList.toggle('active');
        });

        const actorsContainer = document.getElementById('actors-container');
        const pagination = document.getElementById('pagination');
        let currentPage = 0;
        const limit = 8;

        async function loadActors() {
            const response = await fetch(`http://127.0.0.1:5001/actors?offset=${currentPage * limit}&limit=${limit}`);
            const data = await response.json();
            actorsContainer.innerHTML = '';
            for (const actor of data.data.actors) {
                const actorElement = document.createElement('a');
                actorElement.href = `actors/${actor.id}`;
                actorElement.style.textDecoration = 'none';
                actorElement.style.color = 'white';
                actorElement.className = 'actors-section__actor';
                actorElement.innerHTML = `
            <div class="actors-section__actor--div"><img class="actors-section__actor--image" src="${actor.imageUrl !== '' ? actor.imageUrl : "../img/unknown.jpg"}" alt="${actor.name}"></div>
            <h2 class="actors-section__actor--name">${actor.name}</h2>
            <p class="actors-section__actor--movies">${actor.shows.map(show => show.name).join(', ')}</p>
        `;
                actorsContainer.appendChild(actorElement);
            }

            pagination.innerHTML = '';
            if (currentPage > 0) {
                const prevButton = document.createElement('button');
                prevButton.className = 'nav-button';
                prevButton.textContent = 'Prev';
                prevButton.addEventListener('click', (event) => {
                    event.preventDefault();
                    currentPage--;
                    loadActors();
                });
                pagination.appendChild(prevButton);
            }

            if (data.data.actors.length === limit) {
                const nextButton = document.createElement('button');
                nextButton.className = 'nav-button';
                nextButton.textContent = 'Next';
                nextButton.addEventListener('click', (event) => {
                    event.preventDefault();
                    currentPage++;
                    loadActors();
                });
                pagination.appendChild(nextButton);
            }
        }

        loadActors();
    });
</script>
</body>
</html>
