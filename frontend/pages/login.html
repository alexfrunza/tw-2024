<!DOCTYPE html>
<html lang="en-US">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>AcVis</title>
    <link rel="icon" type="image/png" href="../img/iconmonstr-customer-1-64.png" sizes="64x64">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet">

    <link rel="stylesheet" type="text/css" href="../css/index.css">
    <link rel="stylesheet" type="text/css" href="../css/navbar.css">
    <link rel="stylesheet" type="text/css" href="../css/footer.css">
    <link rel="stylesheet" type="text/css" href="../css/login.css">
</head>
<body>

<div class="container">
    <app-navbar></app-navbar>

    <div class="login-section">
        <div class="login-section__art">
            <img src="../img/micah-williams-lmFJOx7hPc4-unsplash.jpg" alt="Hero Image" class="login-section__art--img">
            <h2 class="login-section__art--title"> Keep in touch with the actors </h2>
        </div>
        <div class="login-section__form">
            <h2 class="login-section--title">Login</h2>
            <form id="loginForm" class="login-section--form">
                <label for="username" class="login-section--label">Username:</label>
                <input type="text" id="username" name="username" class="login-section--input" required>
                <label for="password" class="login-section--label">Password:</label>
                <input type="password" id="password" name="password" class="login-section--input" required>
                <button type="submit" class="login-section--button">Login</button>
            </form>
        </div>
    </div>


    <app-footer></app-footer>
</div>

<script type="module" src="../js/index.js"></script>
<script>
    document.addEventListener('DOMContentLoaded', (event) => {
        const navbarToggle = document.getElementById('navbarToggle');
        const navbarLinks = document.getElementById('navbarLinks');

        navbarToggle.addEventListener('click', () => {
            navbarLinks.classList.toggle('active');
        });
    });

</script>

<script>
    document.addEventListener('DOMContentLoaded', (event) => {

        const loginForm = document.getElementById('loginForm');
        loginForm.addEventListener('submit', (e) => {
            e.preventDefault();

            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            fetch('http://localhost:5000/login', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ username, password })
            })
                .then(response => response.json())
                .then(data => {
                    if (data.auth) {
                        console.log('Login successful:', data);
                        localStorage.setItem('token', data.token);
                        window.location.href = '/';
                    } else {
                        console.error('Login failed:', data);
                    }
                })
                .catch(error => console.error('Error during login:', error));
        });
    });
</script>

<script>
    window.onload = function() {
        const isLoggedIn = localStorage.getItem('token') !== null;

        if (isLoggedIn) {
            window.location.href = 'index.html';
        }
    }
</script>
</body>
</html>
