<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AcVis</title>
    <link rel="icon" type="image/png" href="../img/iconmonstr-customer-1-64.png" sizes="64x64">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet">

    <link rel="stylesheet" type="text/css" href="../css/index.css">
    <link rel="stylesheet" type="text/css" href="../css/navbar.css">
    <link rel="stylesheet" type="text/css" href="../css/footer.css">
    <link rel="stylesheet" type="text/css" href="../css/show.css">
</head>
<body>

<div class="container">
    <app-navbar></app-navbar>

    <div class="show">
        <img src="../img/unknown.jpg" alt="unknown" class="show--image">
        <div class="show--name">
            <h1>Unknown</h1>
        </div>
    </div>
    <div class="show--description" id="description">
    </div>
    <div class="show--air-date" id="air-date">
    </div>
    <div class="show__cast" id="cast">
        <h2 class="show--subtitle">Cast</h2>
        <ul class="show--cast-list">
        </ul>
    </div>
    <app-footer></app-footer>
</div>

<script type="module" src="../js/index.js"></script>
<script src="../js/drawer.js"></script>

<script>
    document.addEventListener('DOMContentLoaded', async function () {
        const params = new URLSearchParams(window.location.search);
        const id = params.get('id');

        if (id) {
            try {
                const response = await fetch(`http://127.0.0.1:5001/shows/${id}`);
                if (!response.ok) {
                    throw new Error('Network response was not ok');
                }
                const data = await response.json();
                console.log(data);

                const castList = document.querySelector('.show--cast-list');
                data.data.db.actors.forEach((actor) => {
                    const aTag = document.createElement('a');
                    aTag.href = `/actor.html?id=${actor.id}`;
                    aTag.classList.add('show--actor');
                    aTag.textContent = actor.name;

                    const li = document.createElement('li');
                    li.appendChild(aTag);

                    castList.appendChild(li);
                });


                const showName = document.querySelector('.show--name h1');
                showName.textContent = data.data.tmdb.title || data.data.tmdb.name;

                const description = document.getElementById('description');
                description.innerHTML = `
                    <h2>Description</h2>
                    <p>${data.data.tmdb.overview}</p>
                `;

                const airDate = document.getElementById('air-date');
                airDate.innerHTML = `
                    <h2 class="show--subtitle">Air Date</h2>
                    <p>${data.data.tmdb.first_air_date || data.data.tmdb.release_date}</p>
                `;


                const img = document.querySelector('.show--image');
                img.src = `https://image.tmdb.org/t/p/w500${data.data.tmdb.poster_path}`;


            } catch (error) {
                console.error('Error fetching actor data:', error);
            }
        } else {
            console.error('ID parameter not found in URL');
        }
    });
</script>

</body>
</html>
