<!DOCTYPE html>
<html lang="en-US">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Select statistics</title>
    <link rel="icon" type="image/png" href="../img/iconmonstr-customer-1-64.png" sizes="64x64">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet">

    <link rel="stylesheet" type="text/css" href="../css/index.css">
    <link rel="stylesheet" type="text/css" href="../css/navbar.css">
    <link rel="stylesheet" type="text/css" href="../css/select-statistics.css">
    <link rel="stylesheet" type="text/css" href="../css/footer.css">
    <script src="https://d3js.org/d3.v6.min.js"></script>
    <style>
        .bar {
            fill: steelblue;
        }
        .bar.won {
            fill: orange;
        }
        .axis-label {
            font-size: 12px;
        }
        .title {
            font-size: 16px;
            font-weight: bold;
            text-anchor: middle;
        }
        .axis-label {
            font-family: monospace;
        }

        .svg-text {
            fill: white;
        }

        #win-proportion, #category-distribution {
            margin-top: 100px;
            margin-bottom: 50px;
        }
    </style>
</head>
<body>

<div class="container">
    <app-navbar></app-navbar>

    <section class="select-statistics">
        <img src="../img/rc-xyz-nft-gallery-w9coDxtsfts-unsplash.jpg" alt="Statistic 1" class="select-statistics--img">
        <h2 class="select-statistics--title">Select statistics</h2>
        <form action="/edit_profile" method="post" class="select-statistics__form">
            <label for="stats1" class="select-statistics--label">Statistics 1:</label>
            <select name="gender" id="stats1" class="select-statistics--input">
                <option value="">&emsp;</option>
                <option value="1">1</option>
                <option value="2">2</option>
                <option value="3">3</option>
            </select>

            <label for="stats2" class="select-statistics--label">Statistics 2:</label>
            <select name="gender" id="stats2" class="select-statistics--input">
                <option value="">&emsp;</option>
                <option value="1">1</option>
                <option value="2">2</option>
                <option value="3">3</option>
            </select>

            <label for="stats3" class="select-statistics--label">Statistics 3:</label>
            <select name="gender" id="stats3" class="select-statistics--input">
                <option value="">&emsp;</option>
                <option value="1">1</option>
                <option value="2">2</option>
                <option value="3">3</option>
            </select>

            <label for="stats4" class="select-statistics--label">Statistics 4:</label>
            <select name="gender" id="stats4" class="select-statistics--input">
                <option value="">&emsp;</option>
                <option value="1">1</option>
                <option value="2">2</option>
                <option value="3">3</option>
            </select>

            <label for="stats5" class="select-statistics--label">Statistics 5:</label>
            <select name="gender" id="stats5" class="select-statistics--input">
                <option value="">&emsp;</option>
                <option value="1">1</option>
                <option value="2">2</option>
                <option value="3">3</option>
            </select>

            <button type="submit" class="select-statistics--button">Select</button>

        </form>
    </section>

    <section class="general-statistics">
        <h1>SAG Awards General Statistics</h1>

        <div id="win-proportion"></div>
        <button id="export-winners-svg">Export SVG</button>
        <button id="export-winners-csv">Export CSV</button>

        <div id="category-distribution"></div>
        <button id="export-category-svg">Export SVG</button>
        <button id="export-category-csv">Export CSV</button>

    </section>


    <app-footer></app-footer>
</div>



<script>
    // URL de la care se încarcă datele CSV
    const csvUrl = 'http://127.0.0.1:5001/export-actors-csv';

    d3.csv(csvUrl).then(function(data) {
        // Preprocesarea datelor: Conversia valorilor câmpului 'won' din string în boolean
        data.forEach(d => {
            d.won = (d.won.toLowerCase() === 'true');
        });

        // 1. Distribution by category
        // Creăm un set pentru a ține evidența categoriilor unice
        const categorySet = new Set();

        data.forEach(d => {
            d.category = d.category.trim(); // Se elimină spațiile albe de la început și sfârșit
            categorySet.add(d.category);
        });

        const categoriesData = Array.from(categorySet).map(category => ({
            category,
            count: data.filter(d => d.category === category).length
        }));


        const margin = {top: 40, right: 30, bottom: 40, left: 400},
            width1 = 900 - margin.left - margin.right, // Lățimea ajustată pentru primul grafic
            height1 = categoriesData.length * 20 + margin.top + margin.bottom; // Înălțimea ajustată pentru primul grafic

        const svg1 = d3.select("#category-distribution")
            .append("svg")
            .attr("width", width1 + margin.left + margin.right)
            .attr("height", height1)
            .append("g")
            .attr("transform", `translate(${margin.left},${margin.top})`);

        svg1.append("style")
            .text(`
        .bar {
            fill: steelblue;
        }
        .bar.won {
            fill: orange;
        }
        .axis-label {
            font-size: 12px;
            font-family: monospace;
        }
        .title {
            font-size: 16px;
            font-weight: bold;
            text-anchor: middle;

        }
    `);

        // Add title for the first chart
        svg1.append("text")
            .attr("x", width1 / 2)
            .attr("y", -margin.top / 2)
            .attr("class", "title")
            .style("font-family", "monospace")
            //.style('fill', 'white')
            .classed("svg-text", true)
            .text("Distribution of Nominations by Category");

        const x1 = d3.scaleLinear()
            .domain([0, d3.max(categoriesData, d => d.count)])
            .range([0, width1 - 10]);

        const y1 = d3.scaleBand()
            .domain(categoriesData.map(d => d.category))
            .range([0, categoriesData.length * 20])
            .padding(0.1);

        svg1.append("g")
            .selectAll("rect")
            .data(categoriesData)
            .enter()
            .append("rect")
            .attr("class", "bar")
            .attr("x", 0)
            .attr("y", d => y1(d.category))
            .attr("width", d => x1(d.count))
            .attr("height", y1.bandwidth());

        // Adding numbers at the end of each bar
        svg1.append("g")
            .selectAll("text")
            .data(categoriesData)
            .enter()
            .append("text")
            .attr("x", d => x1(d.count) + 5)
            .attr("y", d => y1(d.category) + y1.bandwidth() / 2)
            .attr("dy", ".35em")
            .style("font-family", "monospace")
            //.style('fill', 'white')
            .classed("svg-text", true)
            .text(d => d.count)
            .attr("data-category", d => d.category)
            .attr("data-count", d => d.count);

        svg1.append("g")
            .call(d3.axisLeft(y1).tickSize(0))
            .selectAll("text")
            .attr("class", "axis-label")
            .style("text-anchor", "end")
            .attr("transform", "translate(-10,0)");

        svg1.append("g")
            .attr("transform", `translate(0,${categoriesData.length * 20})`)
            .call(d3.axisBottom(x1).ticks(5))
            .selectAll("text")
            .attr("class", "axis-label");

        // 2. Proportion of winners vs nominees
        const winProportion = d3.rollup(data, v => v.length, d => d.won);
        const winProportionData = Array.from(winProportion, ([won, count]) => ({won, count}));

        const height2 = winProportionData.length * 30 + margin.top + margin.bottom; // Înălțimea ajustată pentru al doilea grafic

        const svg2 = d3.select("#win-proportion")
            .append("svg")
            .attr("width", width1 + margin.left + margin.right) // Utilizează aceeași lățime ca primul grafic
            .attr("height", height2)
            .append("g")
            .attr("transform", `translate(${margin.left},${margin.top})`);

        svg2.append("style")
            .text(`
        .bar {
            fill: steelblue;
        }
        .bar.won {
            fill: orange;
        }
        .axis-label {
            font-size: 12px;
            font-family: monospace;
        }
        .title {
            font-size: 16px;
            font-weight: bold;
            text-anchor: middle;

        }
    `);

        // Add title for the second chart
        svg2.append("text")
            .attr("x", width1 / 2)
            .attr("y", -margin.top / 2)
            .attr("class", "title")
            .style("font-family", "monospace")
            //.style('fill', 'white')
            .classed("svg-text", true)
            .text("Proportion of Winners vs Nominees");

        const x2 = d3.scaleLinear()
            .domain([0, d3.max(winProportionData, d => d.count)])
            .range([0, width1 - 10]);

        const y2 = d3.scaleBand()
            .domain(winProportionData.map(d => d.won ? 'Winners' : 'Nominees'))
            .range([0, winProportionData.length * 30])
            .padding(0.1);

        svg2.append("g")
            .selectAll("rect")
            .data(winProportionData)
            .enter()
            .append("rect")
            .attr("class", d => d.won ? "bar won" : "bar")
            .attr("x", 0)
            .attr("y", d => y2(d.won ? 'Winners' : 'Nominees'))
            .attr("width", d => x2(d.count))
            .attr("height", y2.bandwidth());

        svg2.append("g")
            .selectAll("text")
            .data(winProportionData)
            .enter()
            .append("text")
            .attr("x", d => x2(d.count) + 5)
            .attr("y", d => y2(d.won ? 'Winners' : 'Nominees') + y2.bandwidth() / 2)
            .attr("dy", ".35em")
            .style("font-family", "monospace")
            .classed("svg-text", true)
            //.style('fill', 'white')
            .text(d => d.count)
            .attr("data-category", d => d.won ? 'Winners' : 'Nominees')
            .attr("data-count", d => d.count);

        svg2.append("g")
            .call(d3.axisLeft(y2).tickSize(0))
            .selectAll("text")
            .attr("class", "axis-label");

        svg2.append("g")
            .attr("transform", `translate(0,${winProportionData.length * 30})`)
            .call(d3.axisBottom(x2).ticks(5))
            .selectAll("text")
            .attr("class", "axis-label");



        function exportCSV(containerID, filename) {
            const svgElement = document.querySelector(containerID + ' svg');

            if (!svgElement) {
                console.error('SVG element not found.');
                return;
            }

            const texts = svgElement.querySelectorAll('text[data-category]');

            let csvContent = "data:text/csv;charset=utf-8,Category,Count\n";

            texts.forEach(text => {
                const category = text.getAttribute('data-category');
                const count = text.getAttribute('data-count');
                if (category && count) {
                    csvContent += `${category},${count}\n`;
                }
            });

            const encodedUri = encodeURI(csvContent);
            const link = document.createElement("a");
            link.setAttribute("href", encodedUri);
            link.setAttribute("download", filename + ".csv");
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        document.getElementById('export-category-csv').addEventListener('click', function() {
            exportCSV('#category-distribution', 'category_distribution');
        });

        document.getElementById('export-winners-csv').addEventListener('click', function() {
            exportCSV('#win-proportion', 'winners_proportion');
        });

    }).catch(function(error) {
        console.error('Error loading the CSV data:', error);
    });


</script>

<script>
    // Funcție pentru exportul SVG
    function exportSVG(containerID, filename) {
        const svgElement = document.querySelector(containerID + ' svg');
        const svgString = new XMLSerializer().serializeToString(svgElement);

        // Adăugare stiluri direct în SVG
        const styledSvgString = svgString.replace('<svg', '<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"><style><![CDATA[' + getSvgStyles(containerID) + ']]></style>');

        const blob = new Blob([styledSvgString], { type: "image/svg+xml;charset=utf-8" });
        const url = URL.createObjectURL(blob);

        const a = document.createElement("a");
        a.href = url;
        a.download = filename + ".svg";
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
    }

    // Funcție pentru a obține stilurile CSS pentru SVG
    function getSvgStyles(containerID) {
        const svgStyle = document.querySelector(containerID + ' style');
        return svgStyle ? svgStyle.textContent : '';
    }

    // Actualizare pentru adăugarea evenimentelor de click pentru export
    document.getElementById('export-category-svg').addEventListener('click', function() {
        exportSVG('#category-distribution', 'category_distribution');
    });

    document.getElementById('export-winners-svg').addEventListener('click', function() {
        exportSVG('#win-proportion', 'winners_proportion');
    });
</script>

<script type="module" src="../js/index.js"></script>
<script src="../js/drawer.js"></script>
</body>
</html>
