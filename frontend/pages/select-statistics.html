<!DOCTYPE html>
<html lang="en-US">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Select statistics</title>
    <link rel="icon" type="image/png" href="../img/iconmonstr-customer-1-64.png" sizes="64x64">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet">

    <link rel="stylesheet" type="text/css" href="../css/index.css">
    <link rel="stylesheet" type="text/css" href="../css/navbar.css">
    <link rel="stylesheet" type="text/css" href="../css/select-statistics.css">
    <link rel="stylesheet" type="text/css" href="../css/footer.css">
    <script src="https://d3js.org/d3.v6.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/d3-tip/0.9.1/d3-tip.min.js"></script>
    <style>
        .general-statistics {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 50px;
        }

        .bar {
            fill: steelblue;
        }

        .bar.won {
            fill: orange;
        }

        .axis-label {
            font-size: 12px;
        }

        .title {
            font-size: 16px;
            font-weight: bold;
            text-anchor: middle;
        }

        .axis-label {
            font-family: monospace;
        }

        .svg-text {
            fill: white;
        }

        #win-proportion, #category-distribution, #nominations-trend {
            margin-top: 100px;
            margin-bottom: 50px;
        }

        .legend {
            font-size: 12px;
            font-family: monospace;
        }
    </style>
</head>

<body>

<div class="container">
    <app-navbar></app-navbar>

    <section class="general-statistics">
        <h1>SAG Awards General Statistics</h1>

        <div id="win-proportion"></div>
        <div>
            <button id="export-winners-svg" class="export-button">Export SVG</button>
            <button id="export-winners-csv" class="export-button">Export CSV</button>
            <button id="export-winners-webp" class="export-button">Export WebP</button>
        </div>

        <div id="category-distribution"></div>
        <div>
            <button id="export-category-svg" class="export-button">Export SVG</button>
            <button id="export-category-csv" class="export-button">Export CSV</button>
            <button id="export-category-webp" class="export-button">Export WebP</button>
        </div>

        <div id="nominations-trend"></div>
        <div id="tooltip"
             style="opacity:0; position:absolute; text-align:center; width:200px; height:55px; color: black; padding:5px; font:12px sans-serif; background:#9ADD5C; border:0px; border-radius:8px; pointer-events:none;"></div>
        <div>
            <button id="export-trend-svg" class="export-button">Export SVG</button>
            <button id="export-trend-csv" class="export-button">Export CSV</button>
            <button id="export-trend-webp" class="export-button">Export WebP</button>
        </div>

    </section>


    <app-footer></app-footer>
</div>


<script>
    // URL de la care se încarcă datele CSV
    const csvUrl = 'http://127.0.0.1:5001/export-actors-csv';

    d3.csv(csvUrl).then(function (data) {
        // Preprocesarea datelor: Conversia valorilor câmpului 'won' din string în boolean
        data.forEach(d => {
            d.won = (d.won.toLowerCase() === 'true');
        });

        // 1. Distribution by category
        // Creăm un set pentru a ține evidența categoriilor unice
        const categorySet = new Set();

        data.forEach(d => {
            d.category = d.category.trim(); // Se elimină spațiile albe de la început și sfârșit
            categorySet.add(d.category);
        });

        const categoriesData = Array.from(categorySet).map(category => ({
            category,
            count: data.filter(d => d.category === category).length
        }));


        const margin = {top: 40, right: 30, bottom: 40, left: 400},
            width1 = 900 - margin.left - margin.right, // Lățimea ajustată pentru primul grafic
            height1 = categoriesData.length * 20 + margin.top + margin.bottom; // Înălțimea ajustată pentru primul grafic

        const svg1 = d3.select("#category-distribution")
            .append("svg")
            .attr("width", width1 + margin.left + margin.right)
            .attr("height", height1)
            .append("g")
            .attr("transform", `translate(${margin.left},${margin.top})`);

        svg1.append("style")
            .text(`
        .bar {
            fill: steelblue;
        }
        .bar.won {
            fill: orange;
        }
        .axis-label {
            font-size: 12px;
            font-family: monospace;
        }
        .title {
            font-size: 16px;
            font-weight: bold;
            text-anchor: middle;

        }
    `);

        // Add title for the first chart
        svg1.append("text")
            .attr("x", (width1 - margin.left + 75) / 2)
            .attr("y", -margin.top / 2)
            .attr("class", "title")
            .style("font-family", "monospace")
            //.style('fill', 'white')
            .classed("svg-text", true)
            .text("Distribution of Nominations by Category");

        const x1 = d3.scaleLinear()
            .domain([0, d3.max(categoriesData, d => d.count)])
            .range([0, width1 - 10]);

        const y1 = d3.scaleBand()
            .domain(categoriesData.map(d => d.category))
            .range([0, categoriesData.length * 20])
            .padding(0.1);

        svg1.append("g")
            .selectAll("rect")
            .data(categoriesData)
            .enter()
            .append("rect")
            .attr("class", "bar")
            .attr("x", 0)
            .attr("y", d => y1(d.category))
            .attr("width", d => x1(d.count))
            .attr("height", y1.bandwidth());

        // Adding numbers at the end of each bar
        svg1.append("g")
            .selectAll("text")
            .data(categoriesData)
            .enter()
            .append("text")
            .attr("x", d => x1(d.count) + 5)
            .attr("y", d => y1(d.category) + y1.bandwidth() / 2)
            .attr("dy", ".35em")
            .style("font-family", "monospace")
            //.style('fill', 'white')
            .classed("svg-text", true)
            .text(d => d.count)
            .attr("data-category", d => d.category)
            .attr("data-count", d => d.count);

        svg1.append("g")
            .call(d3.axisLeft(y1).tickSize(0))
            .selectAll("text")
            .attr("class", "axis-label")
            .style("text-anchor", "end")
            .attr("transform", "translate(-10,0)");

        svg1.append("g")
            .attr("transform", `translate(0,${categoriesData.length * 20})`)
            .call(d3.axisBottom(x1).ticks(5))
            .selectAll("text")
            .attr("class", "axis-label");

        // 2. Proportion of winners vs nominees
        const winProportion = d3.rollup(data, v => v.length, d => d.won);
        const winProportionData = Array.from(winProportion, ([won, count]) => ({won, count}));
        const total = d3.sum(winProportionData, d => d.count);

        const width2 = 900;
        const height2 = 450;
        const radius = Math.min(width2, height2) / 2 - margin.top;

        const svg2 = d3.select("#win-proportion")
            .append("svg")
            .attr("width", width2)
            .attr("height", height2)
            .append("g")
            .attr("transform", `translate(${width2 / 2},${height2 / 2})`);

        svg2.append("style")
            .text(`
                .arc {
                    fill: steelblue;
                }
                .arc.won {
                    fill: orange;
                }
                .title {
                    font-size: 16px;
                    font-weight: bold;
                    text-anchor: middle;
                    font-family: monospace;
                }
                .label {
                    font-size: 12px;
                    font-family: monospace;
                }
            `);

        const color = d3.scaleOrdinal()
            .domain(winProportionData.map(d => d.won ? 'Winners' : 'Nominees'))
            .range(["orange", "steelblue"]);

        const pie = d3.pie()
            .sort(null)
            .value(d => d.count);

        const arc = d3.arc()
            .innerRadius(0)
            .outerRadius(radius);

        const arcs = svg2.selectAll(".arc")
            .data(pie(winProportionData))
            .enter()
            .append("g")
            .attr("class", "arc");

        arcs.append("path")
            .attr("d", arc)
            .attr("class", d => d.data.won ? 'arc won' : 'arc')
            .attr("fill", d => color(d.data.won ? 'Winners' : 'Nominees'));

        arcs.append("text")
            .attr("transform", d => {
                const [x, y] = arc.centroid(d);
                return `translate(${x - 35},${y - 10})`;
            })
            .attr("dy", "0.35em")
            .attr("class", "label")
            .text(d => `${d.data.count} (${((d.data.count / total) * 100).toFixed(1)}%)`)
            .classed("svg-text", true)
            .style('fill', 'white');


        // Add title for the pie chart
        svg2.append("text")
            .attr("x", 0)
            .attr("y", -(height2 / 2) + 20)
            .attr("class", "title")
            .text("Proportion of Winners vs Nominees")
            .classed("svg-text", true);

        // Add legend
        const legend = svg2.append("g")
            .attr("transform", `translate(${width2 / 2 - 200},${-height2 / 2 + 40})`)
            .attr("class", "legend");

        legend.append("rect")
            .attr("x", 0)
            .attr("y", 0)
            .attr("width", 10)
            .attr("height", 10)
            .attr("fill", color("Nominees"));

        legend.append("text")
            .attr("x", 20)
            .attr("y", 10)
            .attr("class", "label")
            .text("Winners")
            .classed("svg-text", true);

        legend.append("rect")
            .attr("x", 0)
            .attr("y", 20)
            .attr("width", 10)
            .attr("height", 10)
            .attr("fill", color("Winners"));

        legend.append("text")
            .attr("x", 20)
            .attr("y", 30)
            .attr("class", "label")
            .text("Nominees who didn't win")
            .classed("svg-text", true);

        const processedData = data.map(d => {
            const year = d.year.slice(0, 4);
            return {
                ...d,
                year: isNaN(year) ? 'Unknown' : +year
            };
        }).filter(d => d.year !== 'Unknown');

// 3. Line chart: Trend of nominations and winners over the years
        const trendData = d3.rollup(processedData, v => ({
            nominations: v.length,
            winners: v.filter(d => d.won).length
        }), d => d.year);

        const trendArray = Array.from(trendData, ([year, values]) => ({
            year,
            nominations: values.nominations,
            winners: values.winners
        }));

        const filteredTrendArray = trendArray.filter(d => !isNaN(d.year) && !isNaN(d.nominations) && !isNaN(d.winners));

        const width3 = 1300 - margin.left - margin.right;
        const height3 = 500 - margin.top - margin.bottom;

        const svg3 = d3.select("#nominations-trend")
            .append("svg")
            .attr("width", width3 + margin.left + margin.right)
            .attr("height", height3 + margin.top + margin.bottom)
            .append("g")
            .attr("transform", `translate(${margin.left - 200},${margin.top})`);

        const x3 = d3.scaleLinear()
            .domain(d3.extent(filteredTrendArray, d => d.year))
            .range([0, width3]);

        const y3 = d3.scaleLinear()
            .domain([0, d3.max(filteredTrendArray, d => Math.max(d.nominations, d.winners))])
            .range([height3, 0]);

        const line1 = d3.line()
            .x(d => x3(d.year))
            .y(d => y3(d.nominations));

        const line2 = d3.line()
            .x(d => x3(d.year))
            .y(d => y3(d.winners));

        svg3.append("g")
            .call(d3.axisLeft(y3))
            .selectAll("text")
            .attr("class", "axis-label");

        svg3.append("g")
            .attr("transform", `translate(0,${height3})`)
            .call(d3.axisBottom(x3).tickFormat(d3.format("d")))
            .selectAll("text")
            .attr("class", "axis-label");

        svg3.append("path")
            .datum(filteredTrendArray)
            .attr("fill", "none")
            .attr("stroke", "steelblue")
            .attr("stroke-width", 1.5)
            .attr("d", line1);

        svg3.append("path")
            .datum(filteredTrendArray)
            .attr("fill", "none")
            .attr("stroke", "orange")
            .attr("stroke-width", 1.5)
            .attr("d", line2);

        svg3.append("text")
            .attr("x", (width3 - margin.left + 425) / 2)
            .attr("y", -margin.top / 2)
            .attr("class", "title")
            .style("font-family", "monospace")
            //.style('fill', 'white')
            .classed("svg-text", true)
            .text("Trend of Nominations and Winners Over the Years");

        const legend3 = svg3.append("g")
            .attr("transform", `translate(${width3 + 25},${height3 - 100})`);

        legend3.append("rect")
            .attr("x", 0)
            .attr("width", 18)
            .attr("height", 18)
            .attr("fill", "steelblue");

        legend3.append("text")
            .attr("x", 24)
            .attr("y", 9)
            .attr("dy", ".35em")
            .style("font-family", "monospace")
            //.style('fill', 'white')
            .classed("svg-text", true)
            .text("Nominees");

        legend3.append("rect")
            .attr("x", 0)
            .attr("y", 20)
            .attr("width", 18)
            .attr("height", 18)
            .attr("fill", "orange");

        legend3.append("text")
            .attr("x", 24)
            .attr("y", 29)
            .attr("dy", ".35em")
            .style("font-family", "monospace")
            //.style('fill', 'white')
            .classed("svg-text", true)
            .text("Winners");

// Tooltip
        const tooltip = d3.select("#tooltip");

        svg3.selectAll(".dot")
            .data(filteredTrendArray)
            .enter().append("circle")
            .attr("class", "dot")
            .attr("cx", d => x3(d.year))
            .attr("cy", d => y3(d.nominations))
            .attr("r", 3)
            //.attr("fill", "white")
            .classed("svg-text", true)
            .on("mouseover", (event, d) => {
                tooltip.transition().duration(200).style("opacity", .9);
                tooltip.html(`Year: ${d.year}<br>Nominations: ${d.nominations}<br>Winners: ${d.winners}`)
                    .style("left", (event.pageX + 5) + "px")
                    .style("top", (event.pageY - 28) + "px");
            })
            .on("mouseout", () => {
                tooltip.transition().duration(500).style("opacity", 0);
            });

        svg3.selectAll(".dot-winners")
            .data(filteredTrendArray)
            .enter().append("circle")
            .attr("class", "dot-winners")
            .attr("cx", d => x3(d.year))
            .attr("cy", d => y3(d.winners))
            .attr("r", 3)
            //.attr("fill", "white")
            .classed("svg-text", true)
            .on("mouseover", (event, d) => {
                tooltip.transition().duration(200).style("opacity", .9);
                tooltip.html(`Year: ${d.year}<br>Nominations: ${d.nominations}<br>Winners: ${d.winners}`)
                    .style("left", (event.pageX + 5) + "px")
                    .style("top", (event.pageY - 28) + "px");
            })
            .on("mouseout", () => {
                tooltip.transition().duration(500).style("opacity", 0);
            });

        // Export buttons functionality
        document.getElementById('export-winners-svg').addEventListener('click', function () {
            const svgElement = document.querySelector('#win-proportion svg');
            const serializer = new XMLSerializer();
            const source = serializer.serializeToString(svgElement);
            const blob = new Blob([source], {type: 'image/svg+xml;charset=utf-8'});
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = url;
            link.download = 'winners_vs_nominees.svg';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        });

        document.getElementById('export-winners-csv').addEventListener('click', function () {
            const csvContent = 'data:text/csv;charset=utf-8,Category,Count\n'
                + winProportionData.map(d => `${d.won ? 'Winners' : 'Nominees'},${d.count}`).join('\n');
            const encodedUri = encodeURI(csvContent);
            const link = document.createElement('a');
            link.href = encodedUri;
            link.download = 'winners_vs_nominees.csv';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        });

        document.getElementById('export-winners-webp').addEventListener('click', function () {
            const svgElement = document.querySelector('#win-proportion svg');
            const serializer = new XMLSerializer();
            const source = serializer.serializeToString(svgElement);
            const canvas = document.createElement('canvas');
            const context = canvas.getContext('2d');
            const image = new Image();
            image.onload = function () {
                canvas.width = image.width;
                canvas.height = image.height;
                context.drawImage(image, 0, 0);
                canvas.toBlob(function (blob) {
                    const url = URL.createObjectURL(blob);
                    const link = document.createElement('a');
                    link.href = url;
                    link.download = 'winners_vs_nominees.webp';
                    document.body.appendChild(link);
                    link.click();
                    document.body.removeChild(link);
                }, 'image/webp');
            };
            image.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(source);
        });

        document.getElementById('export-category-svg').addEventListener('click', function () {
            const svgElement = document.querySelector('#category-distribution svg');
            const serializer = new XMLSerializer();
            const source = serializer.serializeToString(svgElement);
            const blob = new Blob([source], {type: 'image/svg+xml;charset=utf-8'});
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = url;
            link.download = 'category_distribution.svg';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        });

        document.getElementById('export-category-csv').addEventListener('click', function () {
            const csvContent = 'data:text/csv;charset=utf-8,Category,Count\n'
                + categoriesData.map(d => `${d.category},${d.count}`).join('\n');
            const encodedUri = encodeURI(csvContent);
            const link = document.createElement('a');
            link.href = encodedUri;
            link.download = 'category_distribution.csv';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        });

        document.getElementById('export-category-webp').addEventListener('click', function () {
            const svgElement = document.querySelector('#category-distribution svg');
            const serializer = new XMLSerializer();
            const source = serializer.serializeToString(svgElement);
            const canvas = document.createElement('canvas');
            const context = canvas.getContext('2d');
            const image = new Image();
            image.onload = function () {
                canvas.width = image.width;
                canvas.height = image.height;
                context.drawImage(image, 0, 0);
                canvas.toBlob(function (blob) {
                    const url = URL.createObjectURL(blob);
                    const link = document.createElement('a');
                    link.href = url;
                    link.download = 'category_distribution.webp';
                    document.body.appendChild(link);
                    link.click();
                    document.body.removeChild(link);
                }, 'image/webp');
            };
            image.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(source);
        });

        document.getElementById('export-trend-svg').addEventListener('click', function () {
            const svgElement = document.querySelector('#nominations-trend svg');
            const serializer = new XMLSerializer();
            const source = serializer.serializeToString(svgElement);
            const blob = new Blob([source], {type: 'image/svg+xml;charset=utf-8'});
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = url;
            link.download = 'nominations_trend.svg';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        });

        document.getElementById('export-trend-csv').addEventListener('click', function () {
            const csvContent = 'data:text/csv;charset=utf-8,Year,Nominations,Winners\n'
                + filteredTrendArray.map(d => `${d.year},${d.nominations},${d.winners}`).join('\n');
            const encodedUri = encodeURI(csvContent);
            const link = document.createElement('a');
            link.href = encodedUri;
            link.download = 'nominations_trend.csv';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        });

        document.getElementById('export-trend-webp').addEventListener('click', function () {
            const svgElement = document.querySelector('#nominations-trend svg');
            const serializer = new XMLSerializer();
            const source = serializer.serializeToString(svgElement);
            const canvas = document.createElement('canvas');
            const context = canvas.getContext('2d');
            const image = new Image();
            image.onload = function () {
                canvas.width = image.width;
                canvas.height = image.height;
                context.drawImage(image, 0, 0);
                canvas.toBlob(function (blob) {
                    const url = URL.createObjectURL(blob);
                    const link = document.createElement('a');
                    link.href = url;
                    link.download = 'nominations_trend.webp';
                    document.body.appendChild(link);
                    link.click();
                    document.body.removeChild(link);
                }, 'image/webp');
            };
            image.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(source);
        });
    });
</script>

<script type="module" src="../js/index.js"></script>
<script src="../js/drawer.js"></script>

</body>
</html>
