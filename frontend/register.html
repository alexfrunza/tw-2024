<!DOCTYPE html>
<html lang="en-US">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>AcVis</title>
    <link rel="icon" type="image/png" href="./img/iconmonstr-customer-1-64.png" sizes="64x64">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet">

    <link rel="stylesheet" type="text/css" href="./css/index.css">
    <link rel="stylesheet" type="text/css" href="./css/navbar.css">
    <link rel="stylesheet" type="text/css" href="./css/footer.css">
    <link rel="stylesheet" type="text/css" href="./css/register.css">
</head>
<body>

<div class="container">
    <nav class="navbar">
        <div class="navbar--logo">
            <a href="#">AcVis</a>
        </div>
        <div class="navbar__links" id="navbarLinks">
            <a href="#">Dummy 1</a>
            <a href="#">Dummy 2</a>
            <a href="#">Dummy 3</a>
            <a href="#">Login</a>
        </div>
        <button class="navbar--toggle" id="navbarToggle">☰</button>
    </nav>

    <div class="register-section">
        <div class="register-section__art">
            <img src="./img/glenn-carstens-peters-npxXWgQ33ZQ-unsplash.jpg" alt="Hero Image" class="register-section__art--img">
            <h2 class="register-section__art--title"> Create your account now! </h2>
        </div>
        <div class="register-section__form">
            <h2 class="register-section--title">Register</h2>
            <form action="/register" method="post" class="register-section--form">
                <label for="email" class="register-section--label">Email:</label>
                <input type="text" id="email" name="email" class="register-section--input" required>
                <label for="username" class="register-section--label">Username:</label>
                <input type="text" id="username" name="username" class="register-section--input" required>
                <label for="password" class="register-section--label">Password:</label>
                <input type="password" id="password" name="password" class="register-section--input" required>
                <button type="submit" class="register-section--button">Register</button>
            </form>
        </div>
    </div>


    <app-footer></app-footer>
</div>

<script type="module" src="./js/index.js"></script>
<script>
    document.addEventListener('DOMContentLoaded', (event) => {
        const navbarToggle = document.getElementById('navbarToggle');
        const navbarLinks = document.getElementById('navbarLinks');

        navbarToggle.addEventListener('click', () => {
            navbarLinks.classList.toggle('active');
        });
    });

</script>
</body>
</html>
